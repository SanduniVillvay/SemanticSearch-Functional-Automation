<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Precision vs Recall Issue by Query</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 20px;
      background: #f8fafc;
      color: #0f172a;
    }
    h1 { margin: 0 0 14px 0; font-size: 24px; }
    p { margin: 0 0 16px 0; color: #334155; }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
    }
    th, td {
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      padding: 10px 8px;
      font-size: 13px;
      vertical-align: middle;
    }
    th { background: #f1f5f9; position: sticky; top: 0; }
    .bar-wrap {
      width: 220px;
      height: 10px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      border-radius: 999px;
    }
    .precision { background: #0ea5e9; }
    .recall-issue { background: #f97316; }
  </style>
</head>
<body>
  <h1>Query-wise Precision and Recall Issue</h1>
  <p>Generated automatically from benchmark run output.</p>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Query Name</th>
          <th>Precision %</th>
          <th>Precision Graph</th>
          <th>Recall Issue %</th>
          <th>Recall Issue Graph</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Automatic closing hinges</td><td>84.38%</td><td><div class='bar-wrap'><div class='bar precision' style='width:84.38%'></div></div></td><td>9.09%</td><td><div class='bar-wrap'><div class='bar recall-issue' style='width:9.09%'></div></div></td></tr><tr><td>Wax melting tools</td><td>33.33%</td><td><div class='bar-wrap'><div class='bar precision' style='width:33.33%'></div></div></td><td>62.75%</td><td><div class='bar-wrap'><div class='bar recall-issue' style='width:62.75%'></div></div></td></tr><tr><td>wheels for office chairs</td><td>5.22%</td><td><div class='bar-wrap'><div class='bar precision' style='width:5.22%'></div></div></td><td>20.50%</td><td><div class='bar-wrap'><div class='bar recall-issue' style='width:20.50%'></div></div></td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
